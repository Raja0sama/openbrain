[project]
name = "brain"
version = "0.1.0"
description = "A brain that grows by learning, not by getting bigger."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Raja0sama" }]
keywords = ["llm", "memory", "agent", "ollama", "local", "knowledge-graph", "personality", "lifelong-learning"]
dependencies = ["anthropic>=1.13.0"]

[project.urls]
Repository = "https://github.com/raja0sama/openbrain"

[project.scripts]
brain = "brain.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brain"]

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brain</title>
<style>
:root {
  color-scheme: light;
  --surface-0: #f4f4f1;
  --surface-1: #fcfcfb;
  --line:      #dedcd4;
  --ink:       #0b0b0b;
  --ink-2:     #52514e;
  --ink-3:     #86847c;
  --fact:      #2a78d6;
  --episode:   #eb6834;
  --question:  #1baf7a;
  --doc:       #52514e;
  --good:      #1baf7a;
  --warn:      #eda100;
  --bad:       #e34948;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-0: #121211;
    --surface-1: #1a1a19;
    --line:      #33322e;
    --ink:       #ffffff;
    --ink-2:     #c3c2b7;
    --ink-3:     #8b897f;
    --fact:      #3987e5;
    --episode:   #d95926;
    --question:  #199e70;
    --doc:       #c3c2b7;
    --good:      #199e70;
    --warn:      #c98500;
    --bad:       #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0: #121211; --surface-1: #1a1a19; --line: #33322e;
  --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #8b897f;
  --fact: #3987e5; --episode: #d95926; --question: #199e70; --doc: #c3c2b7;
  --good: #199e70; --warn: #c98500; --bad: #e66767;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--surface-0); color: var(--ink);
  font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
  padding: 16px;
}
h1 { font-size: 17px; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 11px; margin: 0 0 10px; color: var(--ink-3);
     text-transform: uppercase; letter-spacing: 0.07em; font-weight: 600; }
.bar { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
       margin-bottom: 14px; }
.sub { color: var(--ink-3); font-size: 12px; }
.pulse { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
         background: var(--good); margin-right: 5px; }
.pulse.off { background: var(--ink-3); }
.grid { display: grid; grid-template-columns: minmax(0,1.9fr) minmax(260px,1fr);
        gap: 14px; align-items: start; }
.card { background: var(--surface-1); border: 1px solid var(--line);
        border-radius: 10px; padding: 14px; }
.stats { display: flex; gap: 22px; flex-wrap: wrap; margin-bottom: 14px; }
.stat b { display: block; font-size: 26px; font-weight: 650; letter-spacing: -0.02em;
          font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--ink-3); text-transform: uppercase;
             letter-spacing: 0.06em; }
#net { width: 100%; height: 460px; display: block; cursor: grab; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px;
          font-size: 12px; color: var(--ink-2); }
.key { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; }
.sq  { width: 10px; height: 10px; border: 2px solid var(--doc); }
.row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px;
       font-size: 13px; }
.row .nm { width: 74px; color: var(--ink-2); flex: none; }
.track { flex: 1; height: 8px; background: var(--surface-0);
         border: 1px solid var(--line); border-radius: 4px; position: relative; }
.track i { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.mid { position: absolute; top: -2px; bottom: -2px; width: 1px;
       background: var(--line); left: 50%; }
.val { width: 54px; text-align: right; color: var(--ink-3); font-size: 12px;
       font-variant-numeric: tabular-nums; flex: none; }
.forming { opacity: 0.55; }
ul { list-style: none; margin: 0; padding: 0; }
li { padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px; }
li:first-child { border-top: 0; }
.tag { font-size: 10.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
#stream li { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
             font-size: 12px; color: var(--ink-2); white-space: pre-wrap; }
#tip { position: fixed; pointer-events: none; opacity: 0; transition: opacity .1s;
       background: var(--surface-1); border: 1px solid var(--line);
       border-radius: 8px; padding: 9px 11px; max-width: 330px; font-size: 12.5px;
       box-shadow: 0 6px 20px rgb(0 0 0 / 0.17); z-index: 9; line-height: 1.45; }
button { font: inherit; font-size: 12px; background: var(--surface-0);
         color: var(--ink-2); border: 1px solid var(--line); border-radius: 7px;
         padding: 4px 10px; cursor: pointer; }
button[aria-pressed="true"] { background: var(--ink); color: var(--surface-1);
                              border-color: var(--ink); }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { text-align: left; color: var(--ink-3); font-weight: 600; font-size: 11px;
     text-transform: uppercase; letter-spacing: 0.05em; padding: 6px 8px 6px 0;
     border-bottom: 1px solid var(--line); }
td { padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line);
     vertical-align: top; }
td.n { font-variant-numeric: tabular-nums; color: var(--ink-3); white-space: nowrap; }
.hidden { display: none !important; }
#chat { height: 320px; overflow-y: auto; padding-right: 4px; }
.msg { margin-bottom: 12px; max-width: 86%; }
.msg.me { margin-left: auto; }
.who { font-size: 10.5px; color: var(--ink-3); text-transform: uppercase;
       letter-spacing: 0.06em; margin-bottom: 3px; }
.msg.me .who { text-align: right; }
.bub { background: var(--surface-0); border: 1px solid var(--line);
       border-radius: 10px; padding: 9px 12px; font-size: 13.5px;
       white-space: pre-wrap; word-wrap: break-word; }
.msg.me .bub { background: var(--fact); border-color: var(--fact); color: #fff; }
.meta { font-size: 11px; color: var(--ink-3); margin-top: 4px; }
.msg.me .meta { text-align: right; }
.learned { color: var(--question); }
.gapnote { color: var(--warn); }
form.say { display: flex; gap: 8px; margin-top: 12px; }
form.say input { flex: 1; font: inherit; font-size: 13.5px; padding: 9px 12px;
  background: var(--surface-0); color: var(--ink);
  border: 1px solid var(--line); border-radius: 9px; }
form.say input:focus { outline: 2px solid var(--fact); outline-offset: -1px; }
form.say button { padding: 9px 16px; background: var(--ink); color: var(--surface-1);
                  border-color: var(--ink); }
form.say button[disabled] { opacity: 0.45; cursor: default; }
.dots::after { content: '.'; animation: d 1.1s steps(4,end) infinite; }
@keyframes d { 0%{content:'.'} 25%{content:'..'} 50%{content:'...'} 75%{content:''} }
.empty { color: var(--ink-3); font-size: 13px; }
@media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="bar">
  <h1 id="name">&hellip;</h1>
  <span class="sub" id="purpose"></span>
  <span style="flex:1"></span>
  <span class="sub"><span class="pulse off" id="pulse"></span><span id="mode">idle</span></span>
</div>

<div class="stats">
  <div class="stat"><b id="n-mem">0</b><span>memories</span></div>
  <div class="stat"><b id="n-link">0</b><span>links</span></div>
  <div class="stat"><b id="n-gap">0</b><span>open gaps</span></div>
  <div class="stat"><b id="n-trait">0</b><span>formed traits</span></div>
</div>

<div class="grid">
  <div>
    <div class="card">
      <h2 style="display:flex;justify-content:space-between;align-items:center">
        <span>Memory graph</span>
        <span>
          <button id="b-graph" aria-pressed="true">Graph</button>
          <button id="b-table" aria-pressed="false">Table</button>
        </span>
      </h2>
      <canvas id="net"></canvas>
      <div id="tablewrap" class="hidden">
        <table><thead><tr><th>#</th><th>Kind</th><th>Memory</th><th>Uses</th><th>Conf</th></tr></thead>
        <tbody id="tbody"></tbody></table>
      </div>
      <div class="legend">
        <span class="key"><i class="dot" style="background:var(--fact)"></i>fact</span>
        <span class="key"><i class="dot" style="background:var(--episode)"></i>episode</span>
        <span class="key"><i class="dot" style="background:var(--question)"></i>anticipated question</span>
        <span class="key"><i class="sq"></i>source document</span>
        <span class="key" style="color:var(--ink-3)">size = times recalled</span>
      </div>
    </div>
    <div class="card" style="margin-top:14px">
      <h2>Talk to her</h2>
      <div id="chat"><p class="empty">Say something. She remembers it.</p></div>
      <form class="say" id="say">
        <input id="msg" placeholder="Ask her something, or teach her a fact"
               autocomplete="off" autofocus>
        <button type="submit" id="send">Send</button>
      </form>
    </div>
    <div class="card" style="margin-top:14px">
      <h2>What she is thinking</h2>
      <ul id="stream"><li class="empty">Connecting...</li></ul>
    </div>
  </div>

  <div>
    <div class="card">
      <h2>Character</h2>
      <div id="traits"></div>
    </div>
    <div class="card" style="margin-top:14px">
      <h2>Mood</h2>
      <div id="mood"></div>
    </div>
    <div class="card" style="margin-top:14px">
      <h2>Knows she doesn't know</h2>
      <ul id="gaps"></ul>
    </div>
  </div>
</div>
<div id="tip"></div>

<script>
const $ = s => document.querySelector(s);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc = t => String(t).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const COLOR = { fact: '--fact', episode: '--episode', question: '--question', document: '--doc' };

// ---------- graph: laid out once, then still. Only new memories move, once, off-screen.
let kinds = [], nodes = [], links = [], hover = null, view = null;
const pos = new Map(), byId = new Map(), adj = new Map(), texts = new Map();
const cv = $('#net'), ctx = cv.getContext('2d');

function seeded(id) {  // same memory, same place, every reload
  let t = (id * 2654435761) >>> 0;
  return () => { t += 0x6D2B79F5; let r = Math.imul(t ^ t >>> 15, 1 | t);
    r ^= r + Math.imul(r ^ r >>> 7, 61 | r); return ((r ^ r >>> 14) >>> 0) / 4294967296; };
}

function relax(movable, iters) {
  const all = nodes.map(n => n.id), mv = [...movable];
  for (let it = 0; it < iters; it++) {
    const cool = 1 - it / iters;
    for (const id of mv) {
      const p = pos.get(id); let fx = -p.x * 0.01, fy = -p.y * 0.01;
      for (const o of all) {
        if (o === id) continue;
        const q = pos.get(o), dx = p.x - q.x, dy = p.y - q.y, d2 = dx * dx + dy * dy + 0.01;
        if (d2 < 9000) { fx += dx * 220 / d2; fy += dy * 220 / d2; }
      }
      for (const [o, w] of adj.get(id) || []) {
        const q = pos.get(o); if (!q) continue;
        const dx = q.x - p.x, dy = q.y - p.y, d = Math.hypot(dx, dy) || 0.01, f = (d - (90 - w * 40)) * 0.02 * w;
        fx += dx / d * f; fy += dy / d * f;
      }
      const m = Math.hypot(fx, fy), cap = 6 * cool + 0.3;
      if (m > cap) { fx *= cap / m; fy *= cap / m; }
      p.x += fx; p.y += fy;
    }
  }
}

function setGraph(g) {
  kinds = g.kinds;
  nodes = g.nodes.map(([id, k, uses, dead]) => ({ id, kind: kinds[k], uses, dead }));
  links = g.links.map(([s, t, w, rel]) => ({ s, t, w, rel }));
  byId.clear(); adj.clear();
  for (const n of nodes) { byId.set(n.id, n); adj.set(n.id, []); }
  for (const l of links) {
    if (!byId.has(l.s) || !byId.has(l.t)) continue;
    adj.get(l.s).push([l.t, l.w]); adj.get(l.t).push([l.s, l.w]);
  }
  const fresh = new Set(), first = pos.size === 0;
  for (const n of nodes) {
    if (pos.has(n.id)) continue;
    const r = seeded(n.id), near = adj.get(n.id).map(([o]) => pos.get(o)).filter(Boolean);
    if (near.length) {
      const x = near.reduce((a, q) => a + q.x, 0) / near.length, y = near.reduce((a, q) => a + q.y, 0) / near.length;
      pos.set(n.id, { x: x + (r() - 0.5) * 30, y: y + (r() - 0.5) * 30 });
    } else {
      const a = r() * Math.PI * 2, d = 40 + r() * 220;
      pos.set(n.id, { x: Math.cos(a) * d, y: Math.sin(a) * d });
    }
    fresh.add(n.id);
  }
  for (const k of [...pos.keys()]) if (!byId.has(k)) pos.delete(k);
  if (fresh.size) relax(first ? byId.keys() : fresh, first ? Math.min(260, 60000 / nodes.length) : 60);
  draw();
}

function fit() {
  const r = cv.getBoundingClientRect(), d = devicePixelRatio || 1;
  cv.width = r.width * d; cv.height = r.height * d;
  ctx.setTransform(d, 0, 0, d, 0, 0);
  return r;
}

const radius = n => 4 + Math.min(10, Math.sqrt(n.uses) * 1.8);

function draw() {
  const box = fit();
  if (!nodes.length || !box.width) { ctx.clearRect(0, 0, box.width, box.height); return; }
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const p of pos.values()) { x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); }
  const pad = 24, k = Math.min((box.width - 2 * pad) / (x1 - x0 || 1), (box.height - 2 * pad) / (y1 - y0 || 1), 2.2);
  const ox = box.width / 2 - (x0 + x1) / 2 * k, oy = box.height / 2 - (y0 + y1) / 2 * k;
  view = { k, ox, oy };
  const at = p => [p.x * k + ox, p.y * k + oy];

  ctx.clearRect(0, 0, box.width, box.height);
  ctx.strokeStyle = css('--line'); ctx.lineWidth = 1.2;
  for (const l of links) {
    const a = pos.get(l.s), b = pos.get(l.t); if (!a || !b) continue;
    const [ax, ay] = at(a), [bx, by] = at(b);
    ctx.globalAlpha = 0.15 + l.w * 0.35;
    ctx.setLineDash(l.rel === 'anticipates' ? [3, 3] : l.rel === 'supersedes' ? [6, 4] : []);
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
  }
  ctx.setLineDash([]);
  const surface = css('--surface-1');
  for (const n of nodes) {
    const p = pos.get(n.id); if (!p) continue;
    const [x, y] = at(p), r = radius(n), c = css(COLOR[n.kind] || '--doc');
    ctx.globalAlpha = n.dead ? 0.22 : 1;
    if (n.kind === 'document') {
      ctx.strokeStyle = c; ctx.lineWidth = 2.2; ctx.strokeRect(x - r, y - r, r * 2, r * 2);
    } else {
      ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = c; ctx.fill();
      ctx.strokeStyle = surface; ctx.lineWidth = 1.5; ctx.stroke();
    }
    if (hover && hover.id === n.id) {
      ctx.globalAlpha = 1; ctx.beginPath(); ctx.arc(x, y, r + 4, 0, 7);
      ctx.strokeStyle = css('--ink'); ctx.lineWidth = 2; ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}
addEventListener('resize', draw);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);

async function showTip(n, e) {
  const tip = $('#tip');
  if (!texts.has(n.id)) {
    texts.set(n.id, null);
    try { texts.set(n.id, await (await fetch('/api/node?id=' + n.id)).json()); } catch (_) { texts.delete(n.id); }
  }
  const m = texts.get(n.id); if (!m || hover !== n) return;
  tip.innerHTML = `<b>${m.kind}</b>${m.dead ? ' · no longer true' : ''} · recalled ${m.uses}×
    · confidence ${m.confidence.toFixed(2)}<br><span style="color:var(--ink-2)">${esc(m.text.slice(0, 260))}</span>`;
  tip.style.left = Math.min(e.clientX + 14, innerWidth - 350) + 'px';
  tip.style.top = (e.clientY + 16) + 'px';
  tip.style.opacity = 1;
}
cv.addEventListener('mousemove', e => {
  if (!view) return;
  const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  let hit = null;
  for (const n of nodes) {
    const p = pos.get(n.id); if (!p) continue;
    if (Math.hypot(p.x * view.k + view.ox - mx, p.y * view.k + view.oy - my) <= radius(n) + 4) { hit = n; break; }
  }
  if (hit !== hover) { hover = hit; draw(); }
  if (hover) showTip(hover, e); else $('#tip').style.opacity = 0;
});
cv.addEventListener('mouseleave', () => { hover = null; $('#tip').style.opacity = 0; draw(); });

// ---------- side panels
let core = { name: '…', serves: '' };

function meter(el, name, value, lo, hi, color, label) {
  const span = hi - lo, left = ((Math.max(lo, Math.min(hi, value)) - lo) / span) * 100;
  const zero = ((0 - lo) / span) * 100, from = Math.min(left, zero), to = Math.max(left, zero);
  el.insertAdjacentHTML('beforeend', `<div class="row ${label.dim ? 'forming' : ''}">
    <span class="nm">${name}</span>
    <span class="track">${lo < 0 ? '<i class="mid"></i>' : ''}
      <i style="left:${lo < 0 ? from : 0}%;width:${lo < 0 ? (to - from) : left}%;background:${color}"></i></span>
    <span class="val">${label.text}</span></div>`);
}

function setState(s) {
  core = s.core;
  $('#name').textContent = document.title = s.core.name;
  $('#purpose').textContent = 'serves ' + s.core.serves;
  $('#n-mem').textContent = s.memories;
  $('#n-link').textContent = s.links;
  $('#n-gap').textContent = s.gaps.length;
  $('#n-trait').textContent = s.traits.filter(t => t.formed).length;
  $('#pulse').className = 'pulse' + (s.thinking ? '' : ' off');
  $('#mode').textContent = s.thinking ? 'thinking' : 'idle';

  const T = $('#traits'); T.innerHTML = s.traits.length ? '' : '<p class="empty">Nothing formed yet. Talk to her.</p>';
  for (const t of s.traits)
    meter(T, t.name, t.value, -1, 1, t.value >= 0 ? css('--fact') : css('--episode'),
      { text: t.formed ? t.value.toFixed(2) : `${t.evidence}/${s.needed}`, dim: !t.formed });
  const M = $('#mood'); M.innerHTML = '';
  for (const [k, v] of Object.entries(s.mood))
    meter(M, k, v, 0, 1, k === 'stress' ? (v > 0.6 ? css('--bad') : css('--warn')) : css('--question'),
      { text: v.toFixed(2), dim: false });

  const yours = s.ask_user.map(g => `<li>${esc(g.question)}
      <div class="tag" style="color:var(--episode)">only you can answer · brain teach ${g.id}</div></li>`).join('');
  $('#gaps').innerHTML = (s.gaps.length
    ? s.gaps.map(g => `<li>${esc(g.question)}<div class="tag">asked ${g.hits}× · tried ${g.tries}× · teach ${g.id}</div></li>`).join('')
    : (yours ? '' : '<li class="empty">No open gaps.</li>')) + yours;
  if (!thoughts.length) renderThoughts(s.thinking);
}

let thoughts = [];
function renderThoughts(thinking = true) {
  $('#stream').innerHTML = thoughts.length
    ? thoughts.slice(0, 12).map(t => `<li>${esc(t.text)}</li>`).join('')
    : (thinking ? '<li class="empty">Quiet. She thinks when nobody has spoken for a minute.</li>'
                : '<li class="empty">Idle. Restart with <code>brain dash --think</code> to watch her think.</li>');
}

// ---------- chat: words stream in as she writes them
const chat = $('#chat');
let streaming = null;

function metaFor(m) {
  if (m.role === 'user') return '';
  if (m.intent === 'refused') return '<div class="meta gapnote">refused — touched her core values</div>';
  let out = '';
  if (m.gap) out += '<div class="meta gapnote">logged as a gap — teach her</div>';
  if (m.general) out += '<div class="meta">general knowledge, not taught</div>';
  for (const l of m.learned || []) out += `<div class="meta learned">remembered (${l.importance}/10): ${esc(l.text)}</div>`;
  for (const c of m.changed || []) out += `<div class="meta learned">changed her mind. was: ${esc(c.was)}</div>`;
  return out;
}

function upsert(m) {
  if (chat.querySelector('.empty')) chat.innerHTML = '';
  let el = document.getElementById('m-' + m.id);
  if (!el) {
    el = document.createElement('div');
    el.id = 'm-' + m.id; el.className = 'msg' + (m.role === 'user' ? ' me' : '');
    el.innerHTML = `<div class="who">${m.role === 'user' ? 'you' : esc(core.name)}</div><div class="bub"></div><div class="metas"></div>`;
    chat.appendChild(el);
  }
  if (m.text !== undefined) el.querySelector('.bub').textContent = m.text;
  el.querySelector('.metas').innerHTML = metaFor(m);
  chat.scrollTop = chat.scrollHeight;
  return el;
}

function busy(on) { $('#send').disabled = on; $('#msg').placeholder = on ? 'She is answering…' : 'Ask her something, or teach her a fact'; }

// ---------- one socket for everything
let sock = null, retry = 500;
function connect() {
  sock = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  sock.onopen = () => { retry = 500; $('#mode').textContent = 'connected'; };
  sock.onclose = () => {
    $('#mode').textContent = 'reconnecting…'; $('#pulse').className = 'pulse off';
    setTimeout(connect, retry = Math.min(retry * 2, 8000));
  };
  sock.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'graph') setGraph(m);
    else if (m.type === 'state') setState(m);
    else if (m.type === 'history') {
      chat.innerHTML = m.chat.length ? '' : '<p class="empty">Say something. She remembers it.</p>';
      m.chat.forEach(upsert); thoughts = m.thoughts; renderThoughts();
    } else if (m.type === 'thought') { thoughts.unshift(m); renderThoughts(); }
    else if (m.type === 'start') {
      streaming = m.id; busy(true);
      upsert({ id: m.id, role: 'assistant' }).querySelector('.bub').innerHTML = '<span class="dots"></span>';
    } else if (m.type === 'waiting') {
      const el = document.getElementById('m-' + m.id);
      if (el) el.querySelector('.metas').innerHTML = '<div class="meta">finishing a thought first…</div>';
    } else if (m.type === 'token') {
      const el = document.getElementById('m-' + m.id); if (!el) return;
      const bub = el.querySelector('.bub');
      if (bub.querySelector('.dots')) { bub.textContent = ''; el.querySelector('.metas').innerHTML = ''; }
      bub.textContent += m.text; chat.scrollTop = chat.scrollHeight;
    } else if (m.type === 'chat') {
      upsert(m);
      if (m.role === 'assistant' && m.id === streaming) { streaming = null; busy(false); $('#msg').focus(); }
    }
  };
}
connect();

$('#say').onsubmit = e => {
  e.preventDefault();
  const box = $('#msg'), text = box.value.trim();
  if (!text || streaming || !sock || sock.readyState !== 1) return;
  sock.send(JSON.stringify({ type: 'say', text }));
  box.value = '';
};

// ---------- table, fetched only when opened
$('#b-graph').onclick = () => {
  $('#b-graph').ariaPressed = 'true'; $('#b-table').ariaPressed = 'false';
  cv.classList.remove('hidden'); $('#tablewrap').classList.add('hidden'); draw();
};
$('#b-table').onclick = async () => {
  $('#b-graph').ariaPressed = 'false'; $('#b-table').ariaPressed = 'true';
  cv.classList.add('hidden'); $('#tablewrap').classList.remove('hidden');
  const rows = await (await fetch('/api/table')).json();
  $('#tbody').innerHTML = rows.map(([id, kind, text, uses, conf, dead]) =>
    `<tr style="${dead ? 'opacity:.45' : ''}"><td class="n">${id}</td><td>${kind}</td><td>${esc(text)}</td>
     <td class="n">${uses}</td><td class="n">${conf.toFixed(2)}</td></tr>`).join('');
};
</script>

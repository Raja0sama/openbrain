<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brain</title>
<style>
:root {
  color-scheme: light;
  --surface-0: #f4f4f1;
  --surface-1: #fcfcfb;
  --line:      #dedcd4;
  --ink:       #0b0b0b;
  --ink-2:     #52514e;
  --ink-3:     #86847c;
  --fact:      #2a78d6;
  --episode:   #eb6834;
  --question:  #1baf7a;
  --doc:       #52514e;
  --good:      #1baf7a;
  --warn:      #eda100;
  --bad:       #e34948;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-0: #121211;
    --surface-1: #1a1a19;
    --line:      #33322e;
    --ink:       #ffffff;
    --ink-2:     #c3c2b7;
    --ink-3:     #8b897f;
    --fact:      #3987e5;
    --episode:   #d95926;
    --question:  #199e70;
    --doc:       #c3c2b7;
    --good:      #199e70;
    --warn:      #c98500;
    --bad:       #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0: #121211; --surface-1: #1a1a19; --line: #33322e;
  --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #8b897f;
  --fact: #3987e5; --episode: #d95926; --question: #199e70; --doc: #c3c2b7;
  --good: #199e70; --warn: #c98500; --bad: #e66767;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--surface-0); color: var(--ink);
  font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
  padding: 16px;
}
h1 { font-size: 17px; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 11px; margin: 0 0 10px; color: var(--ink-3);
     text-transform: uppercase; letter-spacing: 0.07em; font-weight: 600; }
.bar { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
       margin-bottom: 14px; }
.sub { color: var(--ink-3); font-size: 12px; }
.pulse { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
         background: var(--good); margin-right: 5px; }
.pulse.off { background: var(--ink-3); }
.grid { display: grid; grid-template-columns: minmax(0,1.9fr) minmax(260px,1fr);
        gap: 14px; align-items: start; }
.card { background: var(--surface-1); border: 1px solid var(--line);
        border-radius: 10px; padding: 14px; }
.stats { display: flex; gap: 22px; flex-wrap: wrap; margin-bottom: 14px; }
.stat b { display: block; font-size: 26px; font-weight: 650; letter-spacing: -0.02em;
          font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--ink-3); text-transform: uppercase;
             letter-spacing: 0.06em; }
#net { width: 100%; height: 460px; display: block; cursor: grab; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px;
          font-size: 12px; color: var(--ink-2); }
.key { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; }
.sq  { width: 10px; height: 10px; border: 2px solid var(--doc); }
.row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px;
       font-size: 13px; }
.row .nm { width: 74px; color: var(--ink-2); flex: none; }
.track { flex: 1; height: 8px; background: var(--surface-0);
         border: 1px solid var(--line); border-radius: 4px; position: relative; }
.track i { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.mid { position: absolute; top: -2px; bottom: -2px; width: 1px;
       background: var(--line); left: 50%; }
.val { width: 54px; text-align: right; color: var(--ink-3); font-size: 12px;
       font-variant-numeric: tabular-nums; flex: none; }
.forming { opacity: 0.55; }
ul { list-style: none; margin: 0; padding: 0; }
li { padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px; }
li:first-child { border-top: 0; }
.tag { font-size: 10.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
#stream li { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
             font-size: 12px; color: var(--ink-2); white-space: pre-wrap; }
#tip { position: fixed; pointer-events: none; opacity: 0; transition: opacity .1s;
       background: var(--surface-1); border: 1px solid var(--line);
       border-radius: 8px; padding: 9px 11px; max-width: 330px; font-size: 12.5px;
       box-shadow: 0 6px 20px rgb(0 0 0 / 0.17); z-index: 9; line-height: 1.45; }
button { font: inherit; font-size: 12px; background: var(--surface-0);
         color: var(--ink-2); border: 1px solid var(--line); border-radius: 7px;
         padding: 4px 10px; cursor: pointer; }
button[aria-pressed="true"] { background: var(--ink); color: var(--surface-1);
                              border-color: var(--ink); }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { text-align: left; color: var(--ink-3); font-weight: 600; font-size: 11px;
     text-transform: uppercase; letter-spacing: 0.05em; padding: 6px 8px 6px 0;
     border-bottom: 1px solid var(--line); }
td { padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line);
     vertical-align: top; }
td.n { font-variant-numeric: tabular-nums; color: var(--ink-3); white-space: nowrap; }
.hidden { display: none !important; }
#chat { height: 320px; overflow-y: auto; padding-right: 4px; }
.msg { margin-bottom: 12px; max-width: 86%; }
.msg.me { margin-left: auto; }
.who { font-size: 10.5px; color: var(--ink-3); text-transform: uppercase;
       letter-spacing: 0.06em; margin-bottom: 3px; }
.msg.me .who { text-align: right; }
.bub { background: var(--surface-0); border: 1px solid var(--line);
       border-radius: 10px; padding: 9px 12px; font-size: 13.5px;
       white-space: pre-wrap; word-wrap: break-word; }
.msg.me .bub { background: var(--fact); border-color: var(--fact); color: #fff; }
.meta { font-size: 11px; color: var(--ink-3); margin-top: 4px; }
.msg.me .meta { text-align: right; }
.learned { color: var(--question); }
.gapnote { color: var(--warn); }
form.say { display: flex; gap: 8px; margin-top: 12px; }
form.say input { flex: 1; font: inherit; font-size: 13.5px; padding: 9px 12px;
  background: var(--surface-0); color: var(--ink);
  border: 1px solid var(--line); border-radius: 9px; }
form.say input:focus { outline: 2px solid var(--fact); outline-offset: -1px; }
form.say button { padding: 9px 16px; background: var(--ink); color: var(--surface-1);
                  border-color: var(--ink); }
form.say button[disabled] { opacity: 0.45; cursor: default; }
.dots::after { content: '.'; animation: d 1.1s steps(4,end) infinite; }
@keyframes d { 0%{content:'.'} 25%{content:'..'} 50%{content:'...'} 75%{content:''} }
.empty { color: var(--ink-3); font-size: 13px; }
@media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="bar">
  <h1 id="name">&hellip;</h1>
  <span class="sub" id="purpose"></span>
  <span style="flex:1"></span>
  <span class="sub"><span class="pulse off" id="pulse"></span><span id="mode">idle</span></span>
</div>

<div class="stats">
  <div class="stat"><b id="n-mem">0</b><span>memories</span></div>
  <div class="stat"><b id="n-link">0</b><span>links</span></div>
  <div class="stat"><b id="n-gap">0</b><span>open gaps</span></div>
  <div class="stat"><b id="n-trait">0</b><span>formed traits</span></div>
</div>

<div class="grid">
  <div>
    <div class="card">
      <h2 style="display:flex;justify-content:space-between;align-items:center">
        <span>Memory graph</span>
        <span>
          <button id="b-graph" aria-pressed="true">Graph</button>
          <button id="b-table" aria-pressed="false">Table</button>
        </span>
      </h2>
      <canvas id="net"></canvas>
      <div id="tablewrap" class="hidden">
        <table><thead><tr><th>#</th><th>Kind</th><th>Memory</th><th>Uses</th><th>Conf</th></tr></thead>
        <tbody id="tbody"></tbody></table>
      </div>
      <div class="legend">
        <span class="key"><i class="dot" style="background:var(--fact)"></i>fact</span>
        <span class="key"><i class="dot" style="background:var(--episode)"></i>episode</span>
        <span class="key"><i class="dot" style="background:var(--question)"></i>anticipated question</span>
        <span class="key"><i class="sq"></i>source document</span>
        <span class="key" style="color:var(--ink-3)">size = times recalled</span>
      </div>
    </div>
    <div class="card" style="margin-top:14px">
      <h2>Talk to her</h2>
      <div id="chat"><p class="empty">Say something. She remembers it.</p></div>
      <form class="say" id="say">
        <input id="msg" placeholder="Ask her something, or teach her a fact"
               autocomplete="off" autofocus>
        <button type="submit" id="send">Send</button>
      </form>
    </div>
    <div class="card" style="margin-top:14px">
      <h2>What she is thinking</h2>
      <ul id="stream"><li class="empty">Connecting...</li></ul>
    </div>
  </div>

  <div>
    <div class="card">
      <h2>Character</h2>
      <div id="traits"></div>
    </div>
    <div class="card" style="margin-top:14px">
      <h2>Mood</h2>
      <div id="mood"></div>
    </div>
    <div class="card" style="margin-top:14px">
      <h2>Knows she doesn't know</h2>
      <ul id="gaps"></ul>
    </div>
  </div>
</div>
<div id="tip"></div>

<script>
const $ = s => document.querySelector(s);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const KIND = { fact: '--fact', episode: '--episode', question: '--question', document: '--doc' };

let state = null, nodes = [], links = [], pos = new Map(), hover = null;
let sending = false, lastChat = '';
const esc = t => String(t).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const cv = $('#net'), ctx = cv.getContext('2d');

function fit() {
  const r = cv.getBoundingClientRect(), d = devicePixelRatio || 1;
  cv.width = r.width * d; cv.height = r.height * d;
  ctx.setTransform(d, 0, 0, d, 0, 0);
  return r;
}
let box = fit();
addEventListener('resize', () => { box = fit(); });

function sync(s) {
  nodes = s.nodes; links = s.links;
  const live = new Set();
  for (const n of nodes) {
    live.add(n.id);
    if (!pos.has(n.id)) {
      const a = Math.random() * Math.PI * 2, r = 40 + Math.random() * 90;
      pos.set(n.id, { x: box.width / 2 + Math.cos(a) * r, y: box.height / 2 + Math.sin(a) * r, vx: 0, vy: 0 });
    }
  }
  for (const k of [...pos.keys()]) if (!live.has(k)) pos.delete(k);
}

function step() {
  const cx = box.width / 2, cy = box.height / 2;
  for (const n of nodes) {
    const p = pos.get(n.id); if (!p) continue;
    p.vx += (cx - p.x) * 0.0075; p.vy += (cy - p.y) * 0.0075;
    for (const m of nodes) {
      if (m.id === n.id) continue;
      const q = pos.get(m.id); if (!q) continue;
      let dx = p.x - q.x, dy = p.y - q.y, d2 = dx * dx + dy * dy || 0.01;
      if (d2 < 14000) { const f = 300 / d2; p.vx += dx * f; p.vy += dy * f; }
    }
  }
  for (const l of links) {
    const a = pos.get(l.source), b = pos.get(l.target); if (!a || !b) continue;
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.01;
    const rest = 110 - l.weight * 60, f = (d - rest) * 0.009 * l.weight;
    const ux = dx / d * f, uy = dy / d * f;
    a.vx += ux; a.vy += uy; b.vx -= ux; b.vy -= uy;
  }
  for (const p of pos.values()) {
    p.vx *= 0.82; p.vy *= 0.82;
    p.x = Math.max(22, Math.min(box.width - 22, p.x + p.vx));
    p.y = Math.max(22, Math.min(box.height - 22, p.y + p.vy));
  }
}

const radius = n => 5 + Math.min(11, Math.sqrt(n.uses) * 2.1);

function draw() {
  ctx.clearRect(0, 0, box.width, box.height);
  const line = css('--line'), surface = css('--surface-1');

  for (const l of links) {
    const a = pos.get(l.source), b = pos.get(l.target); if (!a || !b) continue;
    ctx.globalAlpha = 0.25 + l.weight * 0.5;
    ctx.strokeStyle = line; ctx.lineWidth = 2;
    if (l.relation === 'anticipates') ctx.setLineDash([3, 3]);
    if (l.relation === 'supersedes') ctx.setLineDash([6, 4]);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.globalAlpha = 1;

  for (const n of nodes) {
    const p = pos.get(n.id); if (!p) continue;
    const r = radius(n), c = css(KIND[n.kind] || '--doc'), on = hover && hover.id === n.id;
    ctx.lineWidth = 2; ctx.strokeStyle = surface;
    ctx.globalAlpha = n.dead ? 0.22 : 1;
    if (n.kind === 'document') {
      ctx.strokeStyle = c; ctx.lineWidth = 2.5;
      ctx.strokeRect(p.x - r, p.y - r, r * 2, r * 2);
    } else {
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7); ctx.fillStyle = c; ctx.fill(); ctx.stroke();
    }
    if (on) {
      ctx.beginPath(); ctx.arc(p.x, p.y, r + 5, 0, 7);
      ctx.strokeStyle = css('--ink'); ctx.lineWidth = 2; ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
}

function loop() { step(); draw(); requestAnimationFrame(loop); }

cv.addEventListener('mousemove', e => {
  const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  hover = null;
  for (const n of nodes) {
    const p = pos.get(n.id); if (!p) continue;
    if (Math.hypot(p.x - mx, p.y - my) <= radius(n) + 4) { hover = n; break; }
  }
  const tip = $('#tip');
  if (hover) {
    tip.innerHTML = `<b>${hover.kind}</b>${hover.dead ? ' · no longer true' : ''} · recalled ${hover.uses}×
      · confidence ${hover.confidence.toFixed(2)}<br>
      <span style="color:var(--ink-2)">${hover.text.replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])).slice(0, 260)}</span>`;
    tip.style.left = Math.min(e.clientX + 14, innerWidth - 350) + 'px';
    tip.style.top = (e.clientY + 16) + 'px';
    tip.style.opacity = 1;
  } else tip.style.opacity = 0;
});
cv.addEventListener('mouseleave', () => { hover = null; $('#tip').style.opacity = 0; });

function meter(el, name, value, lo, hi, color, label) {
  const span = hi - lo, left = ((Math.max(lo, Math.min(hi, value)) - lo) / span) * 100;
  const zero = ((0 - lo) / span) * 100;
  const from = Math.min(left, value < 0 ? zero : zero), to = Math.max(left, zero);
  el.insertAdjacentHTML('beforeend', `<div class="row ${label.dim ? 'forming' : ''}">
    <span class="nm">${name}</span>
    <span class="track">${lo < 0 ? '<i class="mid"></i>' : ''}
      <i style="left:${lo < 0 ? from : 0}%;width:${lo < 0 ? (to - from) : left}%;background:${color}"></i></span>
    <span class="val">${label.text}</span></div>`);
}

function render(s) {
  state = s;
  $('#name').textContent = s.core.name;
  document.title = s.core.name;
  $('#purpose').textContent = 'serves ' + s.core.serves;
  $('#n-mem').textContent = s.nodes.length;
  $('#n-link').textContent = s.links.length;
  $('#n-gap').textContent = s.gaps.length;
  const formed = s.traits.filter(t => t.formed);
  $('#n-trait').textContent = formed.length;
  $('#pulse').className = 'pulse' + (s.thinking ? '' : ' off');
  $('#mode').textContent = s.thinking ? 'thinking' : 'idle';

  const T = $('#traits'); T.innerHTML = '';
  if (!s.traits.length) T.innerHTML = '<p class="empty">Nothing formed yet. Talk to her.</p>';
  for (const t of s.traits) {
    meter(T, t.name, t.value, -1, 1, t.value >= 0 ? css('--fact') : css('--episode'),
      { text: t.formed ? t.value.toFixed(2) : `${t.evidence}/${s.needed}`, dim: !t.formed });
  }

  const M = $('#mood'); M.innerHTML = '';
  for (const [k, v] of Object.entries(s.mood)) {
    const c = k === 'stress' ? (v > 0.6 ? css('--bad') : css('--warn')) : css('--question');
    meter(M, k, v, 0, 1, c, { text: v.toFixed(2), dim: false });
  }

  const G = $('#gaps');
  const yours = (s.ask_user || []).slice(0, 5).map(g => `<li>${esc(g.question.slice(0, 110))}
        <div class="tag" style="color:var(--episode)">only you can answer · brain teach ${g.id}</div></li>`).join('');
  G.innerHTML = (s.gaps.length
    ? s.gaps.slice(0, 7).map(g => `<li>${esc(g.question.slice(0, 110))}
        <div class="tag">asked ${g.hits}× · tried ${g.tries}× · teach ${g.id}</div></li>`).join('')
    : (yours ? '' : '<li class="empty">No open gaps.</li>')) + yours;

  const S = $('#stream');
  S.innerHTML = s.thoughts.length
    ? s.thoughts.slice(0, 12).map(t => `<li>${t.text.replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}</li>`).join('')
    : (s.thinking
        ? '<li class="empty">Warming up. The first thought takes a few seconds.</li>'
        : '<li class="empty">Idle. Restart with <code>brain dash --think</code> to watch her think.</li>');

  $('#tbody').innerHTML = s.nodes.map(n => `<tr><td class="n">${n.id}</td><td>${n.kind}</td>
    <td>${n.text.replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])).slice(0, 150)}</td>
    <td class="n">${n.uses}</td><td class="n">${n.confidence.toFixed(2)}</td></tr>`).join('');

  const C = $('#chat');
  if (!sending && JSON.stringify(s.chat) !== lastChat) {
    lastChat = JSON.stringify(s.chat);
    C.innerHTML = s.chat.length ? s.chat.map(m => {
      const mine = m.role === 'user';
      let meta = '';
      if (!mine) {
        if (m.gap) meta = '<div class="meta gapnote">logged as a gap — teach her</div>';
        else if (m.learned && m.learned.length)
          meta = m.learned.map(l => `<div class="meta learned">remembered (${l.importance}/10): ${esc(l.text)}</div>`).join('');
        if (m.changed && m.changed.length)
          meta += m.changed.map(c => `<div class="meta learned">changed her mind. was: ${esc(c.was)}</div>`).join('');
        else if (m.intent === 'refused') meta = '<div class="meta gapnote">refused — touched her core values</div>';
      }
      return `<div class="msg ${mine ? 'me' : ''}">
        <div class="who">${mine ? 'you' : s.core.name}</div>
        <div class="bub">${esc(m.text)}</div>${meta}</div>`;
    }).join('') : '<p class="empty">Say something. She remembers it.</p>';
    C.scrollTop = C.scrollHeight;
  }

  sync(s);
}

$('#b-graph').onclick = () => {
  $('#b-graph').ariaPressed = 'true'; $('#b-table').ariaPressed = 'false';
  cv.classList.remove('hidden'); $('#tablewrap').classList.add('hidden'); box = fit();
};
$('#b-table').onclick = () => {
  $('#b-graph').ariaPressed = 'false'; $('#b-table').ariaPressed = 'true';
  cv.classList.add('hidden'); $('#tablewrap').classList.remove('hidden');
};

$('#say').onsubmit = async e => {
  e.preventDefault();
  const box = $('#msg'), text = box.value.trim();
  if (!text || sending) return;
  sending = true; box.value = ''; $('#send').disabled = true;
  const C = $('#chat');
  if (C.querySelector('.empty')) C.innerHTML = '';
  C.insertAdjacentHTML('beforeend',
    `<div class="msg me"><div class="who">you</div><div class="bub">${esc(text)}</div></div>
     <div class="msg" id="pending"><div class="who">${state ? state.core.name : '…'}</div>
     <div class="bub"><span class="dots"></span></div></div>`);
  C.scrollTop = C.scrollHeight;
  let failed = null;
  try {
    const r = await fetch('/api/say', { method: 'POST', body: JSON.stringify({ text }) });
    if (!r.ok) failed = r.status === 501
      ? 'This dashboard is running older code and cannot chat. Restart it: brain dash --think'
      : `She did not answer (HTTP ${r.status}).`;
  } catch (err) {
    failed = 'Could not reach her: ' + err;
  }
  sending = false; $('#send').disabled = false; box.focus();
  if (failed) {
    const pend = $('#pending');
    if (pend) { pend.querySelector('.bub').innerHTML = esc(failed);
                pend.querySelector('.bub').style.color = 'var(--bad)';
                pend.removeAttribute('id'); }
  } else lastChat = '';
};

async function poll() {
  try { render(await (await fetch('/api/state')).json()); } catch (e) {}
  setTimeout(poll, 2000);
}
poll(); loop();
</script>
</body>
</html>
